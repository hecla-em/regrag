[project]
name = "regrag-backend"
version = "0.1.0"
description = "RegRag backend — ingestion pipeline and retrieval API"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "anyio>=4",
    "boto3>=1.43.70",
    "certifi>=2026.7.22",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28",
    "langchain-litellm>=0.2",
    "langgraph>=1.0",
    "litellm[caching]>=1.96.2",
    "openai>=1.0",
    "pgvector>=0.4",
    "psycopg[binary]>=3.2",
    "pydantic>=2.13",
    "pydantic-settings>=2.15.0",
    "python-json-logger>=3.3",
    "redis[hiredis]>=6",
    "selectolax>=0.4.11",
    "sentry-sdk[fastapi]>=2.66.1",
    "sqlalchemy[asyncio]>=2.0",
    "tenacity>=9.1",
]

[project.scripts]
ingest = "app.ingestion.cli:main"
retrieve = "app.retrieval.cli:main"
evals = "app.evals.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "ruff>=0.16",
    "ty>=0.0.71",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ty.src]
include = ["app", "tests"]

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["app*"]

name: regrag

x-api: &api
  build: .
  image: regrag-api
  env_file: .env.dev
  environment:
    DB_HOST: db
    REDIS_URL: redis://redis:6379/0

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: regrag
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d regrag"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    <<: *api
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *api
    command: ["fastapi", "run", "--reload", "app/main.py"]
    ports:
      - "8000:8000"
    volumes:
      - ../data:/app/data
    develop:
      watch:
        - path: .
          action: sync
          target: /app/backend
          ignore:
            - .venv
        - path: ./pyproject.toml
          action: rebuild
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  db-data:

# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = 'regrag'
primary_region = 'lhr'

[build]

[deploy]
  release_command = 'alembic upgrade head'
  release_command_timeout = '15m'

[env]
  ENVIRONMENT = 'prod'
  PRIVATE_HOST = 'fly-local-6pn'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    method = 'GET'
    path = '/health'
    interval = '30s'
    timeout = '5s'
    grace_period = '30s'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1

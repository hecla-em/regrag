# Nightly corpus ingest against the production database, raw documents in R2.
# Secrets live in the repo's `prod` environment; `workflow_dispatch` runs it by hand.
name: Ingest

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

# One run at a time, and a late run waits rather than cancelling the one in progress:
# the corpus is only taken for a topic by a run that got through the whole topic.
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: prod
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: "5432"
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASS: ${{ secrets.DB_PASS }}
      DB_NAME: regrag
      STORAGE_BACKEND: r2
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: regrag-raw-docs
      VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run --no-sync alembic upgrade head
      - run: uv run --no-sync ingest
